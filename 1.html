.pvt button.on{border-color:var(--pri)!important;color:var(--pri)!important}
.pvs{flex:1;overflow:auto;padding:8px 12px;direction:ltr}
.xt{border-collapse:collapse;direction:rtl;font-size:12.5px;min-width:100%}
.xt th{background:var(--pri);color:var(--priTx);border:1px solid var(--bd);padding:7px 8px;white-space:nowrap;position:sticky;top:0}
.xt td{border:1px solid var(--bd);padding:6px 8px;white-space:nowrap;text-align:center}
.xt td.rn{background:var(--head);color:var(--mut);font-size:11px;position:sticky;inset-inline-start:0}
.xt td.st{text-align:start;white-space:normal;min-width:240px}
.xt tr.tt td{background:var(--head);font-weight:bold}
.pvf{padding:10px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--bd)}
.pvf button{padding:14px;font-size:16px}
.pvf .cx{background:none!important;color:var(--mut)!important;border:1.5px solid var(--bd)!important}
.av.xl{width:96px;height:96px;font-size:40px;border-radius:50%;margin:0 auto;border:3px solid var(--pri);box-shadow:var(--sh)}
.sbox{position:relative}
.sbox input{padding-inline-end:44px;-webkit-appearance:none;appearance:none}
.sbox input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.sbox .qc{display:none;position:absolute;inset-inline-end:8px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%!important;padding:0!important;font-size:20px;line-height:1;background:var(--bd)!important;color:var(--tx)!important}
.qn{color:var(--mut);font-size:12px;margin:8px 4px 0;min-height:14px}
.sprof{align-items:center;gap:14px}.sprof .av{width:60px;height:60px;font-size:26px;border:2px solid var(--pri)}.sprof b{font-size:18px}.sprof small{display:block;color:var(--mut);font-size:12.5px;margin-top:3px;line-height:1.4}
</style>
<style>
/* دوران الحلقة حول الشعار فقط مع تثبيت مركزها ومقاسها */
@keyframes splashRingSpin{
  from{transform:translate(-50%,-50%) rotate(0deg)}
  to{transform:translate(-50%,-50%) rotate(360deg)}
}
#splash:after{animation:splashRingSpin 8s linear infinite;will-change:transform}
</style>
</head>

function saveFile(name,data){
  var isPdf=String(name).toLowerCase().slice(-4)===".pdf";
  var mime=isPdf?"application/pdf":"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
  function makeBlob(){return data instanceof Blob?data:new Blob([data],{type:mime})}
  function browserDownload(){
    try{
      var blob=makeBlob();
      var file=new File([blob],name,{type:mime});
      if(navigator.canShare&&navigator.canShare({files:[file]})&&navigator.share){
        navigator.share({files:[file],title:name}).then(function(){
          say("xmsg","تم فتح المشاركة. اختار «حفظ في الملفات» لحفظ نسخة Excel أو PDF.","ok");
        }).catch(function(e){
          if(e&&e.name==="AbortError"){say("xmsg","تم إلغاء الحفظ");return}
          downloadBlob(blob);
        });
      }else downloadBlob(blob);
    }catch(e){say("xmsg","تعذر تجهيز الملف. جرّب «مشاركة الأرشيف» ثم «حفظ في الملفات».","bad")}
  }
  function downloadBlob(blob){
    try{
      var url=URL.createObjectURL(blob),a=document.createElement("a");
      a.href=url;a.download=name;a.style.display="none";
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(url)},60000);
      say("xmsg","تم تجهيز ملف متوافق للتنزيل. افتح «الملفات» ثم «التنزيلات».","ok");
    }catch(e){say("xmsg","تعذر تنزيل الملف من المتصفح. استخدم «مشاركة الأرشيف».","bad")}
  }
  if(window.claude&&typeof window.claude.use==="function"){
    try{
      window.claude.use("downloads").then(function(d){
        if(!d||typeof d.save!=="function"){browserDownload();return}
        return d.save({filename:name,data:data}).then(function(){say("xmsg","تم حفظ الملف ✓","ok")}).catch(browserDownload);
      }).catch(browserDownload);
    }catch(e){browserDownload()}
    return;
  }
  browserDownload();
}

function exportPdf(){

  t.cnt=gs.length;host.style.cssText="position:fixed;left:-10000px;top:0";document.body.appendChild(host);
  var pdf=new window.jspdf.jsPDF({unit:"pt",format:"a4"}),pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight();
  function next(){
    if(i>=pages){document.body.removeChild(host);outFile(fname(gs,".pdf"),pdf.output("arraybuffer"));return}

  }
  next();
}
